services:
  postgres:
    image: postgres:17-alpine
    container_name: barberia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barberia_db
      POSTGRES_USER: barberia_user
      POSTGRES_PASSWORD: barberia_pass
    ports:
      - "5433:5432"
    volumes:
      - barberia_pgdata:/var/lib/postgresql/data

volumes:
  barberia_pgdata: